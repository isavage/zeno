services:
  zeno:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeno
    restart: unless-stopped
    ports:
      - "${PORT:-8000}"
    networks:
      - zeno.net
    environment:
      # Doppler passes all secrets directly into environment variables at runtime
      - PORT=${PORT:-8000}
      - HOST=${HOST:-0.0.0.0}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - ZENOS_ENCRYPTION_KEY=${ZENOS_ENCRYPTION_KEY}
      - VAULT_DATA_DIR=/data/vault
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS}
      - TELEGRAM_ADMIN_USER_IDS=${TELEGRAM_ADMIN_USER_IDS}
      - AUTHORIZED_EMAILS=${AUTHORIZED_EMAILS}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - ENABLE_DOCKER_TOOL=${ENABLE_DOCKER_TOOL:-true}
      - DOCKER_ALLOWED_CONTAINERS=${DOCKER_ALLOWED_CONTAINERS:-zeno}
      - DOCKER_COMMAND_TIMEOUT_SECONDS=${DOCKER_COMMAND_TIMEOUT_SECONDS:-20}
      - ENABLE_TERMINAL_TOOL=${ENABLE_TERMINAL_TOOL:-true}
      - TERMINAL_COMMAND_TIMEOUT_SECONDS=${TERMINAL_COMMAND_TIMEOUT_SECONDS:-20}
    volumes:
      - zeno_vault:/data/vault
      # Required only when ENABLE_DOCKER_TOOL=true; this grants host-level Docker access.
      - /var/run/docker.sock:/var/run/docker.sock


volumes:
  zeno_vault:
    driver: local

networks:
  zeno.net:
    name: zeno.net
    driver: bridge
