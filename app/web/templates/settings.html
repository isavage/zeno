<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zeno Settings</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 2rem;}
        label {display: block; margin-top: 1rem;}
        select {width: 100%; max-width: 400px; padding: 0.5rem;}
        button {margin-top: 1rem; padding: 0.5rem 1rem;}
        #status {margin-top: 1rem; color: green;}
    </style>
</head>
<body>
    <h1>Zeno Model Settings</h1>
    <form id="settings-form">
        <label for="fast-model">Fast Model:</label>
        <select id="fast-model" name="fast_model"></select>

        <label for="reasoning-model">Reasoning Model:</label>
        <select id="reasoning-model" name="reasoning_model"></select>

        <label for="fallback-model">Fallback Model:</label>
        <select id="fallback-model" name="fallback_model"></select>

        <button type="submit">Save Settings</button>
    </form>
    <div id="status"></div>

    <script>
        const adminToken = "{{ admin_token }}"; // injected from FastAPI
        const modelsEndpoint = "/admin/models";
        const defaultsEndpoint = "/admin/defaults";
        const setEndpoint = "/admin/defaults";

        async function loadModels() {
            const resp = await fetch(modelsEndpoint);
            const data = await resp.json();
            const models = data.available_models;
            // Flatten into a single array of model strings
            const all = Object.values(models).flat();
            return all;
        }

        async function populateSelect(selectId, options, selectedValue) {
            const select = document.getElementById(selectId);
            select.innerHTML = "";
            for (const val of options) {
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = val;
                if (val === selectedValue) opt.selected = true;
                select.appendChild(opt);
            }
        }

        async function init() {
            const [allModels, defaults] = await Promise.all([loadModels(), fetch(defaultsEndpoint).then(r=>r.json())]);
            await populateSelect('fast-model', allModels, defaults.fast_model);
            await populateSelect('reasoning-model', allModels, defaults.reasoning_model);
            await populateSelect('fallback-model', allModels, defaults.fallback_model);
        }

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fast = document.getElementById('fast-model').value;
            const reasoning = document.getElementById('reasoning-model').value;
            const fallback = document.getElementById('fallback-model').value;
            const payload = new URLSearchParams();
            payload.append('fast_model', fast);
            payload.append('reasoning_model', reasoning);
            payload.append('fallback_model', fallback);
            try {
                const resp = await fetch(setEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Token': adminToken
                    },
                    body: payload
                });
                if (resp.ok) {
                    document.getElementById('status').textContent = 'Settings saved successfully.';
                } else {
                    const err = await resp.json();
                    document.getElementById('status').textContent = 'Error: ' + (err.detail || err.message);
                    document.getElementById('status').style.color = 'red';
                }
            } catch (ex) {
                document.getElementById('status').textContent = 'Network error.';
                document.getElementById('status').style.color = 'red';
            }
        });

        init();
    </script>
</body>
</html>
