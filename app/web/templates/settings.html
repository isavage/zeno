<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeno Settings</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-body">
    <div class="admin-shell">
        <header class="admin-topbar">
            <div>
                <div class="admin-kicker">Zeno Control Panel</div>
                <h1>Model Settings</h1>
            </div>
            <div class="admin-topbar-actions">
                <a class="admin-topbar-link" href="/admin">Admin Home</a>
                <a class="admin-topbar-link" href="/">Open App</a>
            </div>
        </header>

        <main class="admin-content">
            <form id="settings-form" class="admin-form">
                <label for="fast-model">Fast Model</label>
                <select id="fast-model" name="fast_model"></select>

                <label for="reasoning-model">Reasoning Model</label>
                <select id="reasoning-model" name="reasoning_model"></select>

                <label for="fallback-model">Fallback Model</label>
                <select id="fallback-model" name="fallback_model"></select>

                <button type="submit" class="admin-primary-btn">Save Settings</button>
            </form>
            <div id="status" class="admin-status"></div>
        </main>
    </div>

    <script>
        const modelsEndpoint = "/admin/models";
        const defaultsEndpoint = "/admin/defaults";
        const setEndpoint = "/admin/defaults";

        async function loadModels() {
            const resp = await fetch(modelsEndpoint);
            const data = await resp.json();
            return data.available_models || {};
        }

        function providerLabel(provider) {
            return {
                openai: "OpenAI",
                deepseek: "DeepSeek",
                kimi: "Moonshot",
                openrouter: "OpenRouter",
            }[provider] || provider;
        }

        async function populateSelect(selectId, catalog, selectedValue) {
            const select = document.getElementById(selectId);
            select.innerHTML = "";
            for (const [provider, options] of Object.entries(catalog)) {
                if (!options || !options.length) continue;
                const group = document.createElement("optgroup");
                group.label = providerLabel(provider);
                for (const val of options) {
                    const opt = document.createElement("option");
                    opt.value = val;
                    opt.textContent = val;
                    if (val === selectedValue) opt.selected = true;
                    group.appendChild(opt);
                }
                select.appendChild(group);
            }
        }

        async function init() {
            const [catalog, defaults] = await Promise.all([loadModels(), fetch(defaultsEndpoint).then(r=>r.json())]);
            await populateSelect('fast-model', catalog, defaults.fast_model);
            await populateSelect('reasoning-model', catalog, defaults.reasoning_model);
            await populateSelect('fallback-model', catalog, defaults.fallback_model);
        }

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fast = document.getElementById('fast-model').value;
            const reasoning = document.getElementById('reasoning-model').value;
            const fallback = document.getElementById('fallback-model').value;
            const payload = new URLSearchParams();
            payload.append('fast_model', fast);
            payload.append('reasoning_model', reasoning);
            payload.append('fallback_model', fallback);
            try {
                const resp = await fetch(setEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: payload
                });
                if (resp.ok) {
                    document.getElementById('status').textContent = 'Settings saved successfully.';
                } else {
                    const err = await resp.json();
                    document.getElementById('status').textContent = 'Error: ' + (err.detail || err.message);
                    document.getElementById('status').style.color = 'red';
                }
            } catch (ex) {
                document.getElementById('status').textContent = 'Network error.';
                document.getElementById('status').style.color = 'red';
            }
        });

        init();
    </script>
</body>
</html>
