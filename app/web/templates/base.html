<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Zeno Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-shell">
        <header class="admin-topbar">
            <div>
                <div class="admin-kicker">Zeno Control Panel</div>
                <h1>{% block header_title %}Admin{% endblock %}</h1>
            </div>
            <div class="admin-topbar-actions">
                <a class="admin-topbar-link" href="/">Open App</a>
                <a class="admin-topbar-link" href="/auth/logout">Sign Out</a>
            </div>
        </header>

        <main class="admin-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
